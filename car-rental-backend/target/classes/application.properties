# =============================================
#   Car Rental Backend - Application Config
# =============================================

spring.application.name=car-rental-backend

# -------------------------
# H2 In-Memory Database (DEV)
# -------------------------
spring.datasource.url=jdbc:h2:mem:carrentaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------
# MySQL (PROD) - Uncomment to use
# -------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/carrentaldb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword

# -------------------------
# PostgreSQL (ALT) - Uncomment to use
# -------------------------
# spring.datasource.url=jdbc:postgresql://localhost:5432/carrentaldb
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword

# -------------------------
# JPA / Hibernate
# -------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For MySQL:      org.hibernate.dialect.MySQLDialect
# For PostgreSQL: org.hibernate.dialect.PostgreSQLDialect

# -------------------------
# JWT
# -------------------------
jwt.secret=CarRentalSecretKey2024!VeryLongAndSecureBase64EncodedSecretKeyForJWT
jwt.expiration=86400000

# -------------------------
# Server
# -------------------------
server.port=8080

# -------------------------
# CORS (React frontend)
# -------------------------
cors.allowed-origins=http://localhost:3000
